name: Delivery

# Reusable pipeline behind release.yml (release/X.Y.Z) and hotfix.yml (hotfix/X.Y.Z):
#   CI → `vercel build --prod` ONCE (artifact) → deploy-preview: that output as a production deployment without
#   the domains (environment preview, approval) → deploy-production: `vercel promote` of that SAME deployment
#   (environment produccion, approval) → the release pull request to main is marked as deployed.
# Switches (organization variables, 'true' = on): ENABLE_REQSAI_LANDING_PREVIEW, ENABLE_REQSAI_LANDING_PRODUCCION.
# Pull request previews stay with the Vercel Git integration, without a GitHub environment.

on:
  workflow_call:

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@63.1.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Version and switches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview_enabled: ${{ steps.switches.outputs.preview_enabled }}
      production_enabled: ${{ steps.switches.outputs.production_enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the version
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(.github/scripts/release-version.sh "$BRANCH")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump the version in the branch name"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### reqsai-landing v$version from \`$BRANCH\` at \`${GITHUB_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the deploy switches
        id: switches
        env:
          PREVIEW_SWITCH: ${{ vars.ENABLE_REQSAI_LANDING_PREVIEW }}
          PRODUCTION_SWITCH: ${{ vars.ENABLE_REQSAI_LANDING_PRODUCCION }}
        run: |
          preview=false production=false
          [ "$PREVIEW_SWITCH" = true ] && preview=true
          [ "$PRODUCTION_SWITCH" = true ] && production=true
          {
            echo "preview_enabled=$preview"
            echo "production_enabled=$production"
          } >> "$GITHUB_OUTPUT"
          panel="Kntro-Soft → Settings → Secrets and variables → Actions → Variables"
          if [ "$preview" != true ]; then
            echo "::notice title=Deploy skipped::ENABLE_REQSAI_LANDING_PREVIEW is not 'true': nothing is built or deployed."
            echo "- Build, preview and production skipped: organization variable \`ENABLE_REQSAI_LANDING_PREVIEW\` is not \`true\` ($panel). Production only promotes a preview." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$production" != true ]; then
            echo "::notice title=Production skipped::ENABLE_REQSAI_LANDING_PRODUCCION is not 'true': only the preview is deployed."
            echo "- Production skipped: organization variable \`ENABLE_REQSAI_LANDING_PRODUCCION\` is not \`true\` ($panel)." >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build once
    needs: [prepare, ci]
    if: needs.prepare.outputs.preview_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm and the Vercel CLI
        run: npm install --global pnpm@12.4.2 "$VERCEL_CLI"

      - name: Build the production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Upload the build output
        uses: actions/upload-artifact@v7
        with:
          name: vercel-output
          path: .vercel/output
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy-preview:
    name: Deploy the preview
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: preview-reqsai-landing
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Vercel CLI
        run: npm install --global "$VERCEL_CLI"

      - name: Download the build output
        uses: actions/download-artifact@v8
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy it without the production domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview of the production build: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Promote to produccion
    needs: [prepare, deploy-preview]
    if: needs.prepare.outputs.production_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: produccion
      url: ${{ vars.LANDING_URL }}
    concurrency:
      group: produccion-reqsai-landing
      cancel-in-progress: false
    steps:
      - name: Install the Vercel CLI
        run: npm install --global "$VERCEL_CLI"

      - name: Promote the approved preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          vercel promote "$URL" --yes --token="$VERCEL_TOKEN"
          echo "Promoted $URL to the production domains." >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Mark the release pull request as deployed
    needs: [prepare, deploy-preview, deploy-production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on the pull request to main, or explain how to open it
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          URL: ${{ needs.deploy-preview.outputs.url }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open \
            --json number,isDraft --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
            echo "::notice title=Open the release pull request::$url"
            echo "No open pull request from \`$BRANCH\` to \`main\`: [open it]($url) (title \`release: v$VERSION\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          body="$RUNNER_TEMP/comment.md"
          cat > "$body" <<MD
          Deployed to **produccion**: \`$GITHUB_SHA\`

          - Vercel deployment (built once, previewed, then promoted): $URL
          - Pipeline: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Merging this pull request tags \`v$VERSION\` on this commit.
          MD
          gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          if [ "$(jq -r .isDraft <<<"$pr")" = true ]; then
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not mark #$number as ready for review"
          fi
          echo "Release pull request: #$number" >> "$GITHUB_STEP_SUMMARY"
