name: CI

# Pull requests, and pushes to the Gitflow branches: the release pull request is opened by the GitHub App
# reqsai-release-bot, so it gets its own pull_request run, and the push to release/** or hotfix/** checks the same
# head commit. release.yml reuses it (workflow_call) so a candidate is only built from a commit that passed CI.
on:
  pull_request:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@12.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
