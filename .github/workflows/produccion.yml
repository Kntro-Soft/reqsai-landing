name: Produccion

# A push to main (a merged release/X.Y.Z or hotfix/X.Y.Z pull request), docs/deploy.md:
#   prepare     finds the candidate vX.Y.Z-rc.N whose tree hash equals this commit's tree (otherwise it fails:
#               main differs from what was tested) and that passed staging (or skipped it).
#   produccion  [approval in `produccion`] deploys THAT candidate's bundle (SHA-256 and dist/ fingerprint
#               verified, nothing rebuilt) to the production branch `main` of the Cloudflare Pages project
#               reqsai-landing, then the production URL must serve /version.json and index.html of it.
#   release     only then: tag vX.Y.Z + GitHub Release with the same bundle and candidate.json, and the
#               back-merge pull request main → develop.
# If produccion fails, is rejected or is switched off, there is no tag; "Re-run failed jobs" deploys the same
# candidate again.
# Switch (organization variable, 'true' = on): ENABLE_REQSAI_LANDING_PRODUCCION.

on:
  push:
    branches: [main]

concurrency:
  group: produccion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION_FILE: package.json
  PAGES_PROJECT: reqsai-landing
  PAGES_URL: https://reqsai-landing.pages.dev
  WRANGLER_VERSION: 4.149.0

jobs:
  prepare:
    name: Find the approved candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.find.outputs.version }}
      released: ${{ steps.find.outputs.released }}
      tag: ${{ steps.find.outputs.tag }}
      candidate: ${{ steps.find.outputs.candidate }}
      production_enabled: ${{ steps.switch.outputs.production_enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match this commit's tree with a tested release candidate
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/candidate.sh version "$VERSION_FILE")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::v$version is already released; this push to main deploys nothing."
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          json=$(.github/scripts/candidate.sh find "$version" "$tree")
          {
            echo "released=false"
            echo "tag=$(jq -r .tag <<<"$json")"
            echo "candidate=$json"
          } >> "$GITHUB_OUTPUT"
          echo "### v$version from candidate $(jq -r .tag <<<"$json") (stage $(jq -r .stage <<<"$json"), tree \`${tree:0:12}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the production switch and the Cloudflare secrets
        id: switch
        if: steps.find.outputs.released == 'false'
        env:
          SWITCH: ${{ vars.ENABLE_REQSAI_LANDING_PRODUCCION }}
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CLOUDFLARE" != true ]; then
            echo "production_enabled=false" >> "$GITHUB_OUTPUT"
            msg="The secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing (docs/deploy.md): nothing is deployed and the version is not tagged. Add them and re-run all jobs."
          elif [ "$SWITCH" != true ]; then
            echo "production_enabled=false" >> "$GITHUB_OUTPUT"
            msg="ENABLE_REQSAI_LANDING_PRODUCCION is not 'true': nothing is deployed and the version is not tagged. Turn it on and re-run all jobs (Kntro-Soft → Settings → Secrets and variables → Actions → Variables)."
          else
            echo "production_enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning title=Production skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  produccion:
    name: Deploy to produccion
    needs: prepare
    if: needs.prepare.outputs.released == 'false' && needs.prepare.outputs.production_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: ${{ vars.LANDING_URL || env.PAGES_URL }}
    concurrency:
      group: produccion-reqsai-landing
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      deployment: ${{ steps.deploy.outputs.deployment-url }}
      url: ${{ steps.url.outputs.url }}
    steps:
      # LANDING_URL (variable of the environment produccion) is the public address of the landing: the
      # Pages URL, or the custom domain once it is attached to the Pages project. Unset = the Pages URL.
      - name: Resolve the production URL
        id: url
        env:
          LANDING_URL: ${{ vars.LANDING_URL }}
        run: |
          url="${LANDING_URL:-$PAGES_URL}"
          if [[ "$url" == *vercel.app* ]]; then
            echo "::error title=LANDING_URL still points to Vercel::The landing is served by Cloudflare Pages now. Set the variable LANDING_URL of the environment produccion to $PAGES_URL (or to the custom domain attached to the Pages project), then re-run all jobs."
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy the candidate to the Pages production branch
        id: deploy
        uses: ./.github/actions/pages-deploy
        with:
          branch: main
          head-ref: main
          release-tag: ${{ needs.prepare.outputs.tag }}
          commit-message: v${{ needs.prepare.outputs.version }} from ${{ needs.prepare.outputs.tag }}
          github-token: ${{ github.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ env.PAGES_PROJECT }}
          wrangler-version: ${{ env.WRANGLER_VERSION }}

      - name: Check that production serves this candidate
        if: steps.deploy.outputs.deployed == 'true'
        env:
          URL: ${{ steps.url.outputs.url }}
          VERSION: ${{ steps.deploy.outputs.version }}
          COMMIT: ${{ steps.deploy.outputs.commit }}
        run: |
          .github/scripts/check-deployment.sh "$PAGES_URL" "$VERSION" "$COMMIT" dist/index.html
          if [ "$URL" != "$PAGES_URL" ]; then
            .github/scripts/check-deployment.sh "$URL" "$VERSION" "$COMMIT" dist/index.html
          fi

  release:
    name: Tag v${{ needs.prepare.outputs.version }} and back-merge
    needs: [prepare, produccion]
    if: needs.produccion.result == 'success' && needs.produccion.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the tag vX.Y.Z and its GitHub Release; reqsai-release-bot opens the back-merge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish v${{ needs.prepare.outputs.version }} with the candidate's bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DEPLOYMENT: ${{ needs.produccion.outputs.deployment }}
          LANDING_URL: ${{ needs.produccion.outputs.url }}
        run: |
          dir="$RUNNER_TEMP/candidate"
          .github/scripts/candidate.sh fetch "$TAG" "$dir"
          jq --arg url "$LANDING_URL" --arg deployment "$DEPLOYMENT" \
            '. + {production_url: $url, production_deployment_url: $deployment}' <<<"$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          mapfile -t assets < <(jq -r --arg dir "$dir" '.assets | keys[] | "\($dir)/\(.)"' "$RUNNER_TEMP/candidate.json")
          url=$(.github/scripts/candidate.sh final "$RUNNER_TEMP/candidate.json" "$GITHUB_SHA" "${assets[@]}")
          echo "Released: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App reqsai-release-bot) are required to open the back-merge pull request. Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi

      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # auto-merge
          permission-pull-requests: write
          permission-workflows: write # auto-merge of a back-merge that changes .github/workflows

      - name: Open the back-merge pull request into develop as reqsai-release-bot
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          body="$RUNNER_TEMP/back-merge.md"
          {
            echo "Gitflow back-merge of release $VERSION, now tagged [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION) and deployed."
            echo
            echo "Brings the fixes made on the release or hotfix branch (and its version bump) back into \`develop\`. Merge with a merge commit, not a squash, so \`develop\` and \`main\` share history."
          } > "$body"
          url=$(.github/scripts/candidate.sh pr main develop "chore: merge release $VERSION back into develop" "$body")
          if [ -z "$url" ]; then
            echo "Back-merge: not needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Back-merge: $url ($(.github/scripts/candidate.sh automerge "$url"))" >> "$GITHUB_STEP_SUMMARY"
