name: Produccion

# A push to main (a merged release/X.Y.Z or hotfix/X.Y.Z pull request):
#   find the candidate vX.Y.Z-rc.N whose tree hash equals this commit's tree (otherwise fail: main differs from
#   what was tested) → approval in produccion → `vercel promote` of the SAME deployment that staging served (or,
#   when staging was skipped, `vercel deploy --prebuilt --prod` of the stored output, SHA-256 checked) → the
#   production domain must serve /version.json of this candidate → only then tag vX.Y.Z + GitHub Release with the
#   same output, and the back-merge pull request main → develop. Nothing is rebuilt.
# Switch (organization variable, 'true' = on): ENABLE_REQSAI_LANDING_PRODUCCION.

on:
  push:
    branches: [main]

concurrency:
  group: produccion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION_FILE: package.json
  VERCEL_CLI: vercel@63.1.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Find the approved candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.find.outputs.version }}
      released: ${{ steps.find.outputs.released }}
      tag: ${{ steps.find.outputs.tag }}
      candidate: ${{ steps.find.outputs.candidate }}
      production_enabled: ${{ steps.switch.outputs.production_enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match this commit's tree with a tested release candidate
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/candidate.sh version "$VERSION_FILE")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::v$version is already released; this push to main deploys nothing."
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          json=$(.github/scripts/candidate.sh find "$version" "$tree")
          {
            echo "released=false"
            echo "tag=$(jq -r .tag <<<"$json")"
            echo "candidate=$json"
          } >> "$GITHUB_OUTPUT"
          echo "### v$version from candidate $(jq -r .tag <<<"$json") (stage $(jq -r .stage <<<"$json"), tree \`${tree:0:12}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the production switch
        id: switch
        env:
          SWITCH: ${{ vars.ENABLE_REQSAI_LANDING_PRODUCCION }}
        run: |
          if [ "$SWITCH" = true ]; then
            echo "production_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "production_enabled=false" >> "$GITHUB_OUTPUT"
            msg="ENABLE_REQSAI_LANDING_PRODUCCION is not 'true': nothing is deployed and the version is not tagged. Turn it on and re-run all jobs (Kntro-Soft → Settings → Secrets and variables → Actions → Variables)."
            echo "::warning title=Production skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  produccion:
    name: Deploy to produccion
    needs: prepare
    if: needs.prepare.outputs.released == 'false' && needs.prepare.outputs.production_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: ${{ vars.LANDING_URL }}
    concurrency:
      group: produccion-reqsai-landing
      cancel-in-progress: false
    outputs:
      deployment: ${{ steps.deploy.outputs.deployment }}
      url: ${{ vars.LANDING_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Vercel CLI
        run: npm install --global "$VERCEL_CLI"

      - name: Promote the staging deployment, or deploy the stored output
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          deployment=$(jq -r '.deployment_url // empty' <<<"$CANDIDATE")
          if [ -n "$deployment" ]; then
            vercel promote "$deployment" --yes --token="$VERCEL_TOKEN"
            echo "Promoted the staging deployment $deployment (same files, no rebuild)." >> "$GITHUB_STEP_SUMMARY"
          else
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            .github/scripts/candidate.sh fetch "$TAG" "$RUNNER_TEMP/candidate"
            rm -rf .vercel/output
            tar -xzf "$RUNNER_TEMP/candidate/reqsai-landing-$VERSION.tar.gz" -C .vercel
            deployment=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
            echo "Deployed the stored output of $TAG as $deployment (staging was skipped; no rebuild)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      - name: Check that the production domain serves this candidate
        env:
          URL: ${{ vars.LANDING_URL }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: .github/scripts/check-deployment.sh "$URL" "$VERSION" "$(jq -r .commit <<<"$CANDIDATE")"

  release:
    name: Tag v${{ needs.prepare.outputs.version }} and back-merge
    needs: [prepare, produccion]
    if: needs.produccion.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish v${{ needs.prepare.outputs.version }} with the candidate's output
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DEPLOYMENT: ${{ needs.produccion.outputs.deployment }}
          LANDING_URL: ${{ needs.produccion.outputs.url }}
        run: |
          dir="$RUNNER_TEMP/candidate"
          .github/scripts/candidate.sh fetch "$TAG" "$dir"
          jq --arg url "$LANDING_URL" --arg deployment "$DEPLOYMENT" \
            '. + {production_url: $url, production_deployment_url: $deployment}' <<<"$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          mapfile -t assets < <(jq -r --arg dir "$dir" '.assets | keys[] | "\($dir)/\(.)"' "$RUNNER_TEMP/candidate.json")
          url=$(.github/scripts/candidate.sh final "$RUNNER_TEMP/candidate.json" "$GITHUB_SHA" "${assets[@]}")
          echo "Released: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the back-merge pull request into develop
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          body="$RUNNER_TEMP/back-merge.md"
          {
            echo "Gitflow back-merge of release $VERSION, now tagged [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION) and deployed."
            echo
            echo "Brings the fixes made on the release or hotfix branch (and its version bump) back into \`develop\`."
          } > "$body"
          url=$(.github/scripts/candidate.sh pr main develop "chore: merge release $VERSION back into develop" "$body")
          echo "Back-merge: ${url:-not needed}" >> "$GITHUB_STEP_SUMMARY"
