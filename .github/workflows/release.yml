name: Release

# Gitflow release flow, model C + tag at the end. A push to release/X.Y.Z or hotfix/X.Y.Z:
#   CI → `vercel build --prod` ONCE (production settings, version.json with version/build/commit inside) → the
#   output is stored as an asset of the pre-release vX.Y.Z-rc.N with its SHA-256 and the tree hash →
#   staging (environment staging, approval): that output is deployed to Vercel as a production deployment
#   without the domains (--skip-domain) and checked → the pull request release/X.Y.Z → main.
# Merging it runs produccion.yml, which promotes THAT SAME Vercel deployment and only then tags vX.Y.Z.
# Switches (organization variables, 'true' = on): ENABLE_REQSAI_LANDING_PREVIEW (candidate build with the Vercel
# CLI), ENABLE_REQSAI_STAGING (staging; off goes straight to the pull request, e.g. an urgent hotfix).
# Pull request previews stay with the Vercel Git integration, without a GitHub environment.

on:
  push:
    branches: ['release/**', 'hotfix/**']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION_FILE: package.json
  VERCEL_CLI: vercel@63.1.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Version and candidate number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      tag: ${{ steps.candidate.outputs.tag }}
      tree: ${{ steps.candidate.outputs.tree }}
      build_enabled: ${{ steps.switches.outputs.build_enabled }}
      staging_enabled: ${{ steps.switches.outputs.staging_enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the version and number the candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(.github/scripts/candidate.sh branch "$BRANCH" "$VERSION_FILE")
          read -r rc reused < <(.github/scripts/candidate.sh next "$version" "$GITHUB_SHA")
          tree=$(git rev-parse 'HEAD^{tree}')
          {
            echo "version=$version"
            echo "candidate=$version-rc.$rc"
            echo "tag=v$version-rc.$rc"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"
          echo "### reqsai-landing $version-rc.$rc from \`$BRANCH\` at \`${GITHUB_SHA:0:12}\` (tree \`${tree:0:12}\`, reused: $reused)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the switches
        id: switches
        env:
          BUILD_SWITCH: ${{ vars.ENABLE_REQSAI_LANDING_PREVIEW }}
          STAGING_SWITCH: ${{ vars.ENABLE_REQSAI_STAGING }}
        run: |
          build=false staging=false
          [ "$BUILD_SWITCH" = true ] && build=true
          [ "$STAGING_SWITCH" = true ] && staging=true
          {
            echo "build_enabled=$build"
            echo "staging_enabled=$staging"
          } >> "$GITHUB_OUTPUT"
          panel="Kntro-Soft → Settings → Secrets and variables → Actions → Variables"
          if [ "$build" != true ]; then
            echo "::notice title=No release candidate::ENABLE_REQSAI_LANDING_PREVIEW is not 'true': CI runs, but no candidate is built, so this version cannot reach production."
            echo "- No candidate: organization variable \`ENABLE_REQSAI_LANDING_PREVIEW\` is not \`true\` ($panel)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$staging" != true ]; then
            echo "::notice title=Staging skipped::ENABLE_REQSAI_STAGING is not 'true': the candidate goes to the release pull request without a staging deployment."
            echo "- Staging skipped: organization variable \`ENABLE_REQSAI_STAGING\` is not \`true\` ($panel). Production still needs approval." >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  candidate:
    name: Build the candidate once
    needs: [prepare, ci]
    if: needs.prepare.outputs.build_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm and the Vercel CLI
        run: npm install --global pnpm@12.4.2 "$VERCEL_CLI"

      - name: Build the production output once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          # The final version lives inside the output; "rc" only lives in the pre-release name.
          jq -n --arg version "$VERSION" --arg build "$GITHUB_RUN_NUMBER" --arg commit "$GITHUB_SHA" \
            '{version: $version, build: $build, commit: $commit}' > .vercel/output/static/version.json

      - name: Store the candidate as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TREE: ${{ needs.prepare.outputs.tree }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          asset="$RUNNER_TEMP/reqsai-landing-$VERSION.tar.gz"
          tar --sort=name --mtime='1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$asset" -C .vercel output
          sum=$(sha256sum "$asset" | cut -d' ' -f1)
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg version "$VERSION" --arg candidate "$CANDIDATE" \
            --arg tag "$TAG" --arg commit "$GITHUB_SHA" --arg tree "$TREE" --arg branch "$BRANCH" \
            --arg build "$GITHUB_RUN_NUMBER" --arg run_url "$RUN_URL" --arg name "$(basename "$asset")" --arg sum "$sum" \
            '{repository: $repository, version: $version, candidate: $candidate, tag: $tag, commit: $commit,
              tree: $tree, branch: $branch, build: $build, run_url: $run_url, stage: "pending",
              assets: {($name): $sum}}' > "$RUNNER_TEMP/candidate.json"
          url=$(.github/scripts/candidate.sh create "$RUNNER_TEMP/candidate.json" "$asset")
          echo "Candidate: [$TAG]($url) — \`$(basename "$asset")\` sha256 \`$sum\`" >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy to staging
    needs: [prepare, candidate]
    if: needs.prepare.outputs.staging_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: staging-reqsai-landing
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Vercel CLI
        run: npm install --global "$VERCEL_CLI"

      - name: Download the candidate and check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          .github/scripts/candidate.sh fetch "$TAG" "$RUNNER_TEMP/candidate"
          rm -rf .vercel/output
          tar -xzf "$RUNNER_TEMP/candidate/reqsai-landing-$VERSION.tar.gz" -C .vercel

      - name: Deploy it as a production deployment without the domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ALIAS: ${{ vars.LANDING_STAGING_ALIAS }}
        run: |
          deployment=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          url="$deployment"
          if [ -n "$ALIAS" ]; then
            vercel alias set "$deployment" "$ALIAS" --token="$VERCEL_TOKEN"
            url="https://${ALIAS#https://}"
          fi
          {
            echo "deployment=$deployment"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Staging: $url (deployment $deployment)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that staging serves this candidate
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: .github/scripts/check-deployment.sh "$URL" "$VERSION" "$GITHUB_SHA" --allow-protected

      - name: Record the staging deployment in the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
          STAGE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .github/scripts/candidate.sh mark "$TAG" staging \
            "$(jq -cn --arg url "$URL" --arg deployment "$DEPLOYMENT" '{staging_url: $url, deployment_url: $deployment}')" >/dev/null

  ready:
    name: Release candidate ready
    needs: [prepare, candidate, staging]
    if: >-
      ${{ !cancelled() && needs.candidate.result == 'success' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open or update the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          STAGING: ${{ needs.staging.result }}
          STAGE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STAGING" = success ]; then
            json=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern candidate.json --output -)
          else
            json=$(.github/scripts/candidate.sh mark "$TAG" staging-skipped)
          fi
          body="$RUNNER_TEMP/pr.md"
          {
            echo "## Release $VERSION"
            echo
            echo "Candidate **[$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)**: commit \`$(jq -r .commit <<<"$json")\`, tree \`$(jq -r .tree <<<"$json")\`, build $(jq -r .build <<<"$json")."
            echo
            jq -r '.assets | to_entries[] | "- `\(.key)` sha256 `\(.value)` (the `vercel build --prod` output)"' <<<"$json"
            if [ "$STAGING" = success ]; then
              echo "- Staging (approved in \`staging\`): $(jq -r .staging_url <<<"$json") — Vercel deployment $(jq -r .deployment_url <<<"$json")"
            else
              echo "- Staging skipped (\`ENABLE_REQSAI_STAGING\` is not \`true\`): production will deploy the stored output itself."
            fi
            echo
            echo "Merging into \`main\` runs **Produccion** (\`produccion.yml\`): it finds this candidate by tree hash, waits for approval in \`produccion\`, promotes the staging deployment above (or deploys the stored output), checks \`/version.json\`, then tags \`v$VERSION\` and opens the back-merge into \`develop\`."
            echo "A new push to \`$BRANCH\` builds the next candidate and updates this description."
          } > "$body"
          url=$(.github/scripts/candidate.sh pr "$BRANCH" main "release: $VERSION" "$body")
          echo "Release pull request: $url" >> "$GITHUB_STEP_SUMMARY"
