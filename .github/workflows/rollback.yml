name: Rollback

# Puts an earlier final release vX.Y.Z back in production, behind the produccion approval, without building
# (docs/deploy.md → Rollback): the bundle attached to that GitHub Release is verified against its candidate.json
# and deployed to the production branch `main` of the Cloudflare Pages project, then checked.
# The landing holds no data, so there is nothing to restore. Tags and releases do not change: fix forward with
# hotfix/X.Y.Z+1. Releases made before this pipeline (v1.2.1 and older) carry no bundle: roll those back in the
# Cloudflare dashboard (Workers & Pages → reqsai-landing → Deployments → ⋯ → Rollback to this deployment).
# Run it from main.
run-name: Rollback the landing to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to put back in production, X.Y.Z (a final GitHub Release vX.Y.Z)
        type: string
        required: true

concurrency:
  group: produccion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: reqsai-landing
  PAGES_URL: https://reqsai-landing.pages.dev
  WRANGLER_VERSION: 4.149.0

jobs:
  switch:
    name: Production switch
    if: vars.ENABLE_REQSAI_LANDING_PRODUCCION != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why nothing is rolled back
        run: |
          echo "::warning title=Rollback skipped::ENABLE_REQSAI_LANDING_PRODUCCION is not 'true'."
          echo "Rollback skipped: organization variable \`ENABLE_REQSAI_LANDING_PRODUCCION\` is not \`true\` (Kntro-Soft → Settings → Secrets and variables → Actions → Variables)." >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Roll back produccion
    if: vars.ENABLE_REQSAI_LANDING_PRODUCCION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: ${{ vars.LANDING_URL || env.PAGES_URL }}
    concurrency:
      group: produccion-reqsai-landing
      cancel-in-progress: false
    steps:
      - name: Check the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          LANDING_URL: ${{ vars.LANDING_URL }}
        run: |
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got: $VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run the rollback from main (Use workflow from → main)."
            exit 1
          fi
          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>/dev/null); then
            echo "::error::There is no GitHub Release v$VERSION"
            exit 1
          fi
          if [ "$(jq -r '.prerelease or .draft' <<<"$release")" != false ]; then
            echo "::error::v$VERSION is a draft or a pre-release; roll back to a version that reached production"
            exit 1
          fi
          if ! jq -e 'any(.assets[]; .name == "candidate.json")' <<<"$release" >/dev/null; then
            echo "::error title=No bundle in v$VERSION::v$VERSION predates the release pipeline and carries no bundle. Roll back in the Cloudflare dashboard: Workers & Pages → $PAGES_PROJECT → Deployments → ⋯ → Rollback to this deployment."
            exit 1
          fi
          url="${LANDING_URL:-$PAGES_URL}"
          if [[ "$url" == *vercel.app* ]]; then
            echo "::error title=LANDING_URL still points to Vercel::Set the variable LANDING_URL of the environment produccion to $PAGES_URL (or the custom domain of the Pages project)."
            exit 1
          fi
          {
            echo "tag=v$VERSION"
            echo "commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)"
            echo "url=${url%/}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy the release's bundle to the Pages production branch
        id: deploy
        uses: ./.github/actions/pages-deploy
        with:
          branch: main
          release-tag: ${{ steps.release.outputs.tag }}
          commit-hash: ${{ steps.release.outputs.commit }}
          commit-message: Rollback to ${{ steps.release.outputs.tag }}
          github-token: ${{ github.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ env.PAGES_PROJECT }}
          wrangler-version: ${{ env.WRANGLER_VERSION }}

      - name: Check that production serves that release
        env:
          URL: ${{ steps.release.outputs.url }}
          VERSION: ${{ steps.deploy.outputs.version }}
          COMMIT: ${{ steps.deploy.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          .github/scripts/check-deployment.sh "$PAGES_URL" "$VERSION" "$COMMIT" dist/index.html
          if [ "$URL" != "$PAGES_URL" ]; then
            .github/scripts/check-deployment.sh "$URL" "$VERSION" "$COMMIT" dist/index.html
          fi
          echo "Production serves $TAG again. The landing holds no data: nothing to restore. Fix forward with hotfix/X.Y.Z+1." >> "$GITHUB_STEP_SUMMARY"
