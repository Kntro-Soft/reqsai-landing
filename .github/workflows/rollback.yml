name: Rollback

# Puts an earlier final release vX.Y.Z back on the production domain, behind the produccion approval, without
# building: `vercel promote` of the Vercel deployment that release served (recorded in its candidate.json); if
# Vercel no longer keeps it, the release's stored output is deployed with `vercel deploy --prebuilt --prod`.
# The landing holds no data. Run it from main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to put back in production, X.Y.Z (a final GitHub Release vX.Y.Z)
        type: string
        required: true

concurrency:
  group: produccion-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@63.1.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  switch:
    name: Production switch
    if: vars.ENABLE_REQSAI_LANDING_PRODUCCION != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why nothing is rolled back
        run: |
          echo "::warning title=Rollback skipped::ENABLE_REQSAI_LANDING_PRODUCCION is not 'true'."
          echo "Rollback skipped: organization variable \`ENABLE_REQSAI_LANDING_PRODUCCION\` is not \`true\` (Kntro-Soft → Settings → Secrets and variables → Actions → Variables)." >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Roll back produccion
    if: vars.ENABLE_REQSAI_LANDING_PRODUCCION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: ${{ vars.LANDING_URL }}
    concurrency:
      group: produccion-reqsai-landing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Vercel CLI
        run: npm install --global "$VERCEL_CLI"

      - name: Promote the deployment of the release, or deploy its stored output
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got: $VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run the rollback from main (Use workflow from → main)."
            exit 1
          fi
          prerelease=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease) \
            || { echo "::error::There is no GitHub Release v$VERSION"; exit 1; }
          if [ "$prerelease" != false ]; then
            echo "::error::v$VERSION is a pre-release; roll back to a version that reached production"
            exit 1
          fi
          dir="$RUNNER_TEMP/release"
          .github/scripts/candidate.sh fetch "v$VERSION" "$dir"
          echo "commit=$(jq -r .commit "$dir/candidate.json")" >> "$GITHUB_OUTPUT"
          deployment=$(jq -r '.production_deployment_url // .deployment_url // empty' "$dir/candidate.json")
          if [ -n "$deployment" ] && vercel promote "$deployment" --yes --token="$VERCEL_TOKEN"; then
            echo "Promoted $deployment, the deployment of v$VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          asset=$(jq -r '.assets | keys[0] // empty' "$dir/candidate.json")
          if [ -z "$asset" ]; then
            echo "::error::v$VERSION has neither a Vercel deployment to promote nor a stored output (released before this pipeline)"
            exit 1
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          rm -rf .vercel/output
          tar -xzf "$dir/$asset" -C .vercel
          deployment=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed the stored output of v$VERSION as $deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the production domain serves that release
        env:
          URL: ${{ vars.LANDING_URL }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: .github/scripts/check-deployment.sh "$URL" "$VERSION" "$COMMIT"
